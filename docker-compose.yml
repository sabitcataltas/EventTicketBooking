name: event-ticket-booking

include:
  - IDProvider/docker-compose.yml
  - MySQL/docker-compose.yml

services:
  payment:
    build:
      context: .
      dockerfile: MockPaymentService/Dockerfile
    profiles: [app]
    ports:
      - "3100:3100"

  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    profiles: [app]
    env_file:
      - Api/.env.docker
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      payment:
        condition: service_started
